<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Agenda Bartender</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: calendário mensal (domingo a sábado) com chips por evento; abaixo de 720px vira lista por dia. Detalhe abre em painel lateral (desktop) ou folha inferior (celular). */
:root {
  --bg: #eff3f1;
  --surface: #ffffff;
  --surface2: #e6ece9;
  --fg: #13211b;
  --muted: #55665e;
  --line: #d3dcd8;
  --accent: #1d6a50;
  --accent-fg: #ffffff;
  --serra: #a96a12;   --serra-bg: #f6e7cb;
  --acqua: #1d6aa3;   --acqua-bg: #d8e9f6;
  --florest: #2b7a37; --florest-bg: #dbeedc;
  --villa: #7448ab;   --villa-bg: #e8ddf4;
  --warn: #9c3a12;    --warn-bg: #fbe6dc;
  --scrim: rgba(10, 20, 15, 0.45);
  --f-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1511; --surface: #15201b; --surface2: #1e2c25; --fg: #e7efeb; --muted: #94a69d; --line: #2a3b33;
    --accent: #5fc79f; --accent-fg: #0b1a13;
    --serra: #e3a458; --serra-bg: #382a13;
    --acqua: #74b3e8; --acqua-bg: #13304a;
    --florest: #76cd82; --florest-bg: #16351b;
    --villa: #bb9be8; --villa-bg: #2b1f40;
    --warn: #f19a74; --warn-bg: #3e2015;
    --scrim: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1511; --surface: #15201b; --surface2: #1e2c25; --fg: #e7efeb; --muted: #94a69d; --line: #2a3b33;
  --accent: #5fc79f; --accent-fg: #0b1a13;
  --serra: #e3a458; --serra-bg: #382a13;
  --acqua: #74b3e8; --acqua-bg: #13304a;
  --florest: #76cd82; --florest-bg: #16351b;
  --villa: #bb9be8; --villa-bg: #2b1f40;
  --warn: #f19a74; --warn-bg: #3e2015;
  --scrim: rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[data-s="serra"] { --c: var(--serra); --cbg: var(--serra-bg); }
[data-s="acqua"] { --c: var(--acqua); --cbg: var(--acqua-bg); }
[data-s="florest"] { --c: var(--florest); --cbg: var(--florest-bg); }
[data-s="villa"] { --c: var(--villa); --cbg: var(--villa-bg); }

.wrap {
  max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 40px;
}
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(26px, 4vw, 36px); letter-spacing: -0.02em; margin: 0; line-height: 1.05; text-wrap: balance; }
.sub { color: var(--muted); margin: 6px 0 0; }
.nav { display: flex; align-items: center; gap: 8px; }
.nav h2 { font-family: var(--f-display); font-size: 20px; font-weight: 600; margin: 0; min-width: 11ch; text-align: center; text-transform: capitalize; }
.icon-btn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 18px; }
.icon-btn:disabled { opacity: 0.35; cursor: default; }

.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.tot { font-variant-numeric: tabular-nums; color: var(--muted); }
.tot b { color: var(--fg); font-weight: 600; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; }
.pill i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.pill[aria-pressed="false"] { opacity: 0.45; }
.pill[aria-pressed="false"] i { background: transparent; box-shadow: inset 0 0 0 2px var(--c); }
.pill span { color: var(--muted); font-variant-numeric: tabular-nums; }

.cal { background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; }
.wd { background: var(--surface2); padding: 8px 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.day { background: var(--surface); min-height: 118px; padding: 6px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.day.out { background: var(--bg); }
.day.out .dn { opacity: 0.4; }
.dn { font-family: var(--f-display); font-weight: 600; font-size: 14px; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; font-variant-numeric: tabular-nums; }
.day.today .dn { background: var(--accent); color: var(--accent-fg); }
.chip { display: flex; align-items: flex-start; gap: 6px; width: 100%; min-width: 0; text-align: left; padding: 5px 7px; border: 0; border-radius: 7px; background: var(--cbg); font-size: 12.5px; line-height: 1.25; }
.chip i { flex: none; width: 8px; height: 8px; margin-top: 4px; border-radius: 50%; background: var(--c); }
.chip .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.chip .top { display: flex; justify-content: space-between; gap: 6px; font-variant-numeric: tabular-nums; }
.chip b { font-weight: 600; }
.chip .g { color: var(--muted); }
.chip .nm { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.chip:hover { filter: brightness(0.96); }

.agenda { display: none; flex-direction: column; gap: 14px; }
.ag-day { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; }
.ag-date { text-align: center; padding-top: 4px; }
.ag-date b { display: block; font-family: var(--f-display); font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
.ag-date span { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.ag-list { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card { text-align: left; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; display: grid; gap: 4px; }
.card .r1 { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.card .r1 em { font-style: normal; display: inline-flex; align-items: center; gap: 6px; color: var(--fg); font-weight: 600; }
.card .r1 em i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.card .nm { font-weight: 600; overflow-wrap: anywhere; }
.card .r3 { font-size: 13px; color: var(--muted); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; margin-top: 14px; }

.wk { margin-top: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 16px 12px; }
.wk h2 { font-family: var(--f-display); font-size: 16px; font-weight: 600; margin: 0 0 12px; }
.wk .wkn { font-family: var(--f-body); font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 6px; }
.wkbars { display: flex; gap: 12px; }
.wkc { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; border-radius: 8px; padding: 2px; }
.wkc:hover, .wkc:focus-visible { background: var(--surface2); }
.wkv { text-align: center; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.wkp { height: 110px; display: flex; align-items: flex-end; border-bottom: 1px solid var(--line); }
.wkb { width: 100%; max-width: 56px; margin: 0 auto; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }
.wkl { text-align: center; font-size: 11px; line-height: 1.25; color: var(--muted); font-variant-numeric: tabular-nums; }
.foot { margin-top: 18px; color: var(--muted); font-size: 13px; max-width: 70ch; }

#overlay { position: fixed; inset: 0; z-index: 20; }
.scrim { position: absolute; inset: 0; background: var(--scrim); }
.sheet { position: absolute; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; }
.sh-head { position: relative; padding: 20px 68px 16px 20px; padding-top: max(20px, env(safe-area-inset-top, 0px)); border-bottom: 1px solid var(--line); background: var(--cbg); }
.sh-head #close { position: absolute; top: max(14px, env(safe-area-inset-top, 0px)); right: 14px; background: var(--surface); }
.sh-head h3 { font-family: var(--f-display); font-size: 24px; line-height: 1.15; margin: 0; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; overflow-wrap: anywhere; }
.sh-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin: 8px 0 0; }
.sh-meta i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.sh-meta b { font-weight: 600; }
#sh-date { color: var(--muted); }
#sh-date::before { content: "·"; margin-right: 8px; }
.lock { overflow: hidden; }
.sh-body { padding: 16px 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 18px; min-height: 0; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; margin: 0; }
.facts div { min-width: 0; }
.facts dt { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.facts dd { margin: 2px 0 0; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.facts .wide { grid-column: 1 / -1; }
.badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--surface2); }
.badge.ok { background: var(--florest-bg); color: var(--florest); }
.badge.na { background: var(--acqua-bg); color: var(--acqua); }
.badge.nd { background: var(--warn-bg); color: var(--warn); }
.sec h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.sec ul:not(.menu) { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.docs { display: flex; flex-wrap: wrap; gap: 6px; }
.doc { padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line); font-size: 13px; background: var(--bg); }
.doc.miss { border-style: dashed; color: var(--warn); }
.muted { color: var(--muted); margin: 0; }
.ctl { display: flex; flex-direction: column; gap: 10px; }
.ctl .chk { display: flex; align-items: center; gap: 10px; font-weight: 500; }
.ctl input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
.ctl .f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.ctl input[type="text"], .ctl textarea { font: inherit; font-size: 15px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
.ctl textarea { min-height: 72px; resize: vertical; }
.ctl .st { font-size: 12px; color: var(--muted); min-height: 1.2em; }
.mn { margin-top: 12px; }
.mn:first-of-type { margin-top: 0; }
.mn h5 { margin: 0 0 6px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.mn h5 span { font-size: 12px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.menu { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; }
.menu li { position: relative; padding: 6px 10px 6px 24px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); font-size: 14px; overflow-wrap: anywhere; }
.menu li::before { content: ""; position: absolute; left: 10px; top: 13px; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.mn.sem li::before { background: transparent; box-shadow: inset 0 0 0 2px var(--c); }
.mn.extra li::before { border-radius: 2px; background: var(--muted); }
.alert { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 14px; font-weight: 500; }
.sh-foot { display: flex; justify-content: space-between; gap: 8px; padding: 12px 20px; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
.btn { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; }
.btn:disabled { opacity: 0.35; cursor: default; }

@media (max-width: 720px) {
  .cal { display: none; }
  .agenda { display: flex; }
  .sheet { top: auto; left: 0; max-height: 90%; border-left: 0; border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; }
  .sh-head { border-radius: 18px 18px 0 0; padding-top: 20px; }
  .sh-head #close { top: 14px; }
  .nav { width: 100%; justify-content: space-between; }
}
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: slide 0.18s ease-out; }
  @keyframes slide { from { transform: translateX(24px); } to { transform: none; } }
  @media (max-width: 720px) { @keyframes slide { from { transform: translateY(24px); } to { transform: none; } } }
}

html { color-scheme: light; }
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
</style>
</head>

<div class="wrap">
  <header class="top">
    <div>

    </div>
    <div class="nav">
      <button class="icon-btn" id="prev" aria-label="Mês anterior"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2 id="mlabel" aria-live="polite"></h2>
      <button class="icon-btn" id="next" aria-label="Próximo mês"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </header>

  <div class="bar">
    <div class="pills" id="pills" role="group" aria-label="Filtrar por espaço"></div>

  <div class="cal" id="cal" aria-label="Calendário do mês"></div>
  <div class="agenda" id="agenda"></div>
  <div class="empty" id="empty" hidden></div>

  <section class="wk" id="wk-sec" aria-labelledby="wk-h" hidden>
    <h2 id="wk-h">Convidados por semana <span class="wkn">só eventos do mês exibido, sem staff</span></h2>
    <div class="wkbars" id="wk" role="list"></div>
  </section>

  <p class="foot">Fonte: posts do canal até 23/10/2026. Os cardápios de drinks vêm dos PDFs de Bartender anexados no Slack. Convidados não incluem staff.</p>
</div>

<div id="overlay" hidden>
  <div class="scrim" id="scrim"></div>
  <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title">
    <div class="sh-head">
      <button class="icon-btn" id="close" aria-label="Fechar"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <h3 id="sh-title"></h3>
      <p class="sh-meta"><i></i><b id="sh-space"></b><span id="sh-date"></span></p>
    </div>
    <div class="sh-body" id="sh-body"></div>
    <div class="sh-foot">
      <button class="btn" id="evprev">‹ Anterior</button>
      <button class="btn" id="evnext">Próximo ›</button>
    </div>
  </aside>
</div>

function menuHtml(e) {
  const d = DRINKS[e.id];
  if (!d) return `<div class="sec"><h4>Cardápio de drinks</h4><p class="muted">Cardápio ainda não enviado. Não há PDF de Bartender para este evento.</p></div>`;
  const list = (title, items, cls) => items.length
    ? `<div class="mn ${cls}"><h5>${title} <span>${items.length}</span></h5><ul class="menu">${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>` : "";
  const extra = d.extra && d.extra.length
    ? `<div class="mn extra"><h5>Extras do bar</h5><ul class="menu">${d.extra.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>` : "";
  return `<div class="sec"><h4>Cardápio de drinks</h4>${list("Com álcool", d.com, "com")}${list("Sem álcool", d.sem, "sem")}${extra}</div>`;
}

const MONTHS = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const WDAYS = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const MIN = { y: 2026, m: 9 }, MAX = { y: 2026, m: 11 };
const clampMonth = (y, m) => {
  const v = y * 12 + m;
  const c = Math.min(Math.max(v, MIN.y * 12 + MIN.m), MAX.y * 12 + MAX.m);
  return { y: Math.floor(c / 12), m: c % 12 };
};
let view = clampMonth(new Date().getFullYear(), new Date().getMonth());
let active = new Set(Object.keys(SPACES));
let current = null, lastFocus = null;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pad = n => String(n).padStart(2, "0");
const key = (y, m, d) => y + "-" + pad(m + 1) + "-" + pad(d);
const parse = s => { const [y, m, d] = s.split("-").map(Number); return { y, m: m - 1, d }; };
const wday = s => { const p = parse(s); return new Date(p.y, p.m, p.d).getDay(); };
const hour = t => { if (!t) return ""; const [h, m] = t.split(":").map(Number); return m ? h + "h" + pad(m) : h + "h"; };
const dmy = s => { const p = parse(s); return pad(p.d) + "/" + pad(p.m + 1) + "/" + p.y; };
const fmtGuests = e => e.guests + (e.staff ? " + " + e.staff + " staff" : "");

const ALL = EVENTS.slice().sort((a, b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time));

function monthEvents() {
  return ALL.filter(e => { const p = parse(e.date); return p.y === view.y && p.m === view.m; });
}

function renderWeeks(ev) {
  const sec = $("wk-sec");
  const weeks = new Map();
  ev.forEach(e => {
    const p = parse(e.date), dt = new Date(p.y, p.m, p.d);
    const start = new Date(p.y, p.m, p.d - dt.getDay());
    const k = key(start.getFullYear(), start.getMonth(), start.getDate());
    const w = weeks.get(k) || { start, n: 0, g: 0 };
    w.n++; w.g += e.guests; weeks.set(k, w);
  });
  if (!weeks.size) { sec.hidden = true; return; }
  const list = [...weeks.values()].sort((a, b) => a.start - b.start);
  const max = Math.max(...list.map(w => w.g));
  $("wk").innerHTML = list.map(w => {
    const end = new Date(w.start.getFullYear(), w.start.getMonth(), w.start.getDate() + 6);
    const f = d => pad(d.getDate()) + "/" + pad(d.getMonth() + 1);
    const range = f(w.start) + " a " + f(end);
    const txt = range + ": " + w.g.toLocaleString("pt-BR") + " convidados em " + w.n + (w.n === 1 ? " evento" : " eventos");
    return `<div class="wkc" role="listitem" tabindex="0" title="${txt}" aria-label="${txt}"><div class="wkv">${w.g.toLocaleString("pt-BR")}</div><div class="wkp"><div class="wkb" style="height:${Math.max(2, Math.round(w.g / max * 100))}%"></div></div><div class="wkl">${f(w.start)}<br>a ${f(end)}</div></div>`;
  }).join("");
  sec.hidden = false;
}

function renderPills(me) {
  $("pills").innerHTML = Object.keys(SPACES).map(k => {
    const n = me.filter(e => e.space === k).length;
    return `<button class="pill" data-s="${k}" data-sp="${k}" aria-pressed="${active.has(k)}"><i></i>${SPACES[k]} <span>${n}</span></button>`;
  }).join("");
}

function renderCal() {
  const { y, m } = view;
  $("mlabel").textContent = MONTHS[m] + " " + y;
  $("prev").disabled = y === MIN.y && m === MIN.m;
  $("next").disabled = y === MAX.y && m === MAX.m;
  const me = monthEvents();
  renderPills(me);

  const ev = me.filter(e => active.has(e.space));
  const by = {};
  ev.forEach(e => (by[e.date] = by[e.date] || []).push(e));

  const first = new Date(y, m, 1).getDay();
  const dim = new Date(y, m + 1, 0).getDate();
  const prevDim = new Date(y, m, 0).getDate();
  const total = Math.ceil((first + dim) / 7) * 7;
  const now = new Date();
  const todayKey = key(now.getFullYear(), now.getMonth(), now.getDate());

  let html = WDAYS.map(w => `<div class="wd">${w.slice(0, 3)}</div>`).join("");
  for (let i = 0; i < total; i++) {
    const d = i - first + 1;
    if (d < 1 || d > dim) {
      html += `<div class="day out"><span class="dn">${d < 1 ? prevDim + d : d - dim}</span></div>`;
      continue;
    }
    const k = key(y, m, d);
    const chips = (by[k] || []).map(e =>
      `<button class="chip" data-s="${e.space}" data-id="${e.id}" title="${esc(e.name)}"><i></i><span class="tx"><span class="top"><b>${hour(e.time) || "—"}</b><span class="g">${e.guests}</span></span><span class="nm">${esc(e.short)}</span></span></button>`).join("");
    html += `<div class="day${k === todayKey ? " today" : ""}"><span class="dn">${d}</span>${chips}</div>`;
  }
  $("cal").innerHTML = html;

  const dates = Object.keys(by).sort();
  $("agenda").innerHTML = dates.map(k => {
    const p = parse(k);
    const cards = by[k].map(e =>
      `<button class="card" data-s="${e.space}" data-id="${e.id}">
        <div class="r1"><em><i></i>${SPACES[e.space]}</em><span>${hour(e.time)}</span></div>
        <div class="nm">${esc(e.short)}</div>
        <div class="r3">${fmtGuests(e)} convidados · ${BAR[e.bar].t}</div></button>`).join("");
    return `<div class="ag-day"><div class="ag-date"><b>${p.d}</b><span>${WDAYS[wday(k)].slice(0, 3)}</span></div><div class="ag-list">${cards}</div></div>`;
  }).join("");

  const sum = ev.reduce((a, e) => a + e.guests, 0);
  $("tot").innerHTML = `<b>${ev.length}</b> ${ev.length === 1 ? "evento" : "eventos"} · <b>${sum.toLocaleString("pt-BR")}</b> convidados`;

  renderWeeks(ev);

  const empty = $("empty");
  if (!ev.length) {
    empty.hidden = false;
    empty.textContent = me.length
      ? "Nenhum evento nos espaços selecionados."
      : "Nenhum evento lançado em " + MONTHS[m] + ". Eles aparecem aqui quando entram no canal #planejamento-bartender.";
  } else empty.hidden = true;
}

/* Controle da equipe: guardado no db do artefato (coleção "controle", um documento por evento). */
let DB = null, CAN_WRITE = true, CTL = {};
const ctlTimer = {}, ctlQueue = {};

function renderCtl(e) {
  const wrap = $("ctl-wrap");
  if (!wrap || !DB || !e) return;
  const c = CTL[e.id] || {};
  const ro = CAN_WRITE ? "" : " disabled";
  wrap.dataset.ev = e.id;
  wrap.innerHTML = `<div class="sec"><h4>Controle da equipe</h4><div class="ctl">
    <label class="chk" for="ctl-cron"><input type="checkbox" id="ctl-cron"${c.cronograma ? " checked" : ""}${ro}> Cronograma recebido</label>
    <label class="f" for="ctl-equipe">Equipe escalada<input type="text" id="ctl-equipe" maxlength="200" value="${esc(c.equipe || "")}"${ro}></label>
    <label class="f" for="ctl-notas">Anotações<textarea id="ctl-notas" maxlength="1000"${ro}>${esc(c.notas || "")}</textarea></label>
    <div class="st" id="ctl-st" aria-live="polite">${CAN_WRITE ? "" : "Somente leitura para o seu acesso."}</div></div></div>`;
}

const CTL_FIELDS = { cronograma: "ctl-cron", equipe: "ctl-equipe", notas: "ctl-notas" };

function readCtl() {
  const cron = $("ctl-cron"), eq = $("ctl-equipe"), nt = $("ctl-notas");
  if (!cron || !eq || !nt) return null;
  return { cronograma: cron.checked, equipe: eq.value.trim(), notas: nt.value.trim() };
}

function setCtlStatus(id, text) {
  const s = $("ctl-st");
  if (s && current && current.id === id) s.textContent = text;
}

function lockCtl() {
  CAN_WRITE = false;
  Object.values(CTL_FIELDS).forEach(i => { const el = $(i); if (el) el.disabled = true; });
  const s = $("ctl-st");
  if (s) s.textContent = "Não foi possível salvar. Seu acesso pode ser só de leitura.";
}

function saveCtl(id) {
  clearTimeout(ctlTimer[id]); delete ctlTimer[id];
  const w = $("ctl-wrap");
  if (!DB || !CAN_WRITE || !current || current.id !== id || !w || Number(w.dataset.ev) !== id) return;
  const data = readCtl();
  if (!data) return;
  const prev = CTL[id];
  /* grava só os campos que mudaram, para não apagar a edição de outra pessoa nos demais */
  const changed = {};
  Object.keys(data).forEach(k => { if (!prev || data[k] !== (k === "cronograma" ? !!prev[k] : (prev[k] || ""))) changed[k] = data[k]; });
  if (!Object.keys(changed).length) return;
  setCtlStatus(id, "Salvando…");
  const ref = DB.doc("controle/" + id);
  ctlQueue[id] = (ctlQueue[id] || Promise.resolve())
    .then(() => (prev ? ref.update(changed) : ref.set(data)))
    .then(() => setCtlStatus(id, "Salvo"))
    .catch(err => {
      if (err && err.code === "invalid_argument") { if (current && current.id === id) lockCtl(); else CAN_WRITE = false; }
      else setCtlStatus(id, "Não foi possível salvar. Tente de novo.");
    });
}

function flushCtl() {
  if (current && ctlTimer[current.id] !== undefined) saveCtl(current.id);
}

/* traz para os campos o que outra pessoa gravou, sem mexer no campo em que se está digitando */
function syncCtl(e) {
  const c = CTL[e.id] || {};
  const at = document.activeElement;
  const cron = $("ctl-cron"), eq = $("ctl-equipe"), nt = $("ctl-notas");
  if (!cron || !eq || !nt) return;
  if (cron !== at && cron.checked !== !!c.cronograma) cron.checked = !!c.cronograma;
  if (eq !== at && eq.value !== (c.equipe || "")) eq.value = c.equipe || "";
  if (nt !== at && nt.value !== (c.notas || "")) nt.value = c.notas || "";
}

async function initDb() {
  try {
    if (!window.claude || !window.claude.use) return;
    const db = await window.claude.use("db");
    if (!db) return;
    const user = await window.claude.use("user");
    if (user) { try { if ((await user.can("data.write")) === false) CAN_WRITE = false; } catch (_) {} }
    DB = db;
    db.collection("controle").onSnapshot(snap => {
      const m = {};
      snap.docs.forEach(d => { if (d.exists) m[d.id] = d.data(); });
      CTL = m;
      if (current) { if ($("ctl-wrap").contains(document.activeElement)) syncCtl(current); else renderCtl(current); }
    }, () => {});
    if (current) renderCtl(current);
  } catch (_) { /* sem db: a página funciona só como consulta */ }
}

function openEvent(id, fromNav) {
  const e = EVENTS.find(x => x.id === id);
  if (!e) return;
  flushCtl();
  current = e;
  if (!fromNav) lastFocus = document.activeElement;
  const sheet = $("sheet");
  sheet.setAttribute("data-s", e.space);
  $("sh-space").textContent = SPACES[e.space];
  $("sh-title").textContent = e.name;
  $("sh-date").textContent = WDAYS[wday(e.date)] + ", " + dmy(e.date);
  const b = BAR[e.bar];
  const docs = e.docs.length
    ? e.docs.map(d => `<span class="doc">${esc(d)}</span>`).join("")
    : `<span class="doc miss">Nenhum PDF anexado</span>`;
  $("sh-body").innerHTML =
    (e.alerts || []).map(a => `<div class="alert">${esc(a)}</div>`).join("") +
    `<dl class="facts">
      <div><dt>Convite</dt><dd>${hour(e.time) || "Não informado"}</dd></div>
      <div><dt>Convidados</dt><dd>${fmtGuests(e)}</dd></div>
      <div><dt>Mesas</dt><dd>${esc(e.tables)}</dd></div>
      <div><dt>Duração</dt><dd>${esc(e.party)}</dd></div>
      <div class="wide"><dt>Bar</dt><dd><span class="badge ${b.k}">${b.t}</span></dd></div>
    </dl>` +
    `<div class="sec"><h4>Observações</h4>${e.obs.length ? "<ul>" + e.obs.map(o => `<li>${esc(o)}</li>`).join("") + "</ul>" : "<p>Sem observações no post.</p>"}</div>` +
    menuHtml(e) +
    `<div id="ctl-wrap"></div>` +
    `<div class="sec"><h4>Documentos no Slack</h4><div class="docs">${docs}</div></div>`;
  $("sh-body").scrollTop = 0;
  renderCtl(e);
  const i = ALL.indexOf(e);
  $("evprev").disabled = i <= 0;
  $("evnext").disabled = i >= ALL.length - 1;
  $("evprev").dataset.to = i > 0 ? ALL[i - 1].id : "";
  $("evnext").dataset.to = i < ALL.length - 1 ? ALL[i + 1].id : "";
  $("overlay").hidden = false;
  document.documentElement.classList.add("lock");
  $("close").focus();
}

function closeEvent() {
  flushCtl();
  const id = current && current.id;
  $("overlay").hidden = true;
  document.documentElement.classList.remove("lock");
  current = null;
  if (lastFocus && document.contains(lastFocus)) { lastFocus.focus(); return; }
  const back = id && document.querySelector('[data-id="' + id + '"]');
  (back || $("next")).focus();
}

function shiftMonth(delta) {
  let m = view.m + delta, y = view.y;
  if (m < 0) { m = 11; y--; } else if (m > 11) { m = 0; y++; }
  if (y < MIN.y || (y === MIN.y && m < MIN.m) || y > MAX.y || (y === MAX.y && m > MAX.m)) return;
  view = { y, m };
  renderCal();
}

$("prev").addEventListener("click", () => shiftMonth(-1));
$("next").addEventListener("click", () => shiftMonth(1));
$("pills").addEventListener("click", ev => {
  const b = ev.target.closest("[data-sp]");
  if (!b) return;
  const k = b.dataset.sp;
  active.has(k) ? active.delete(k) : active.add(k);
  renderCal();
  const nb = document.querySelector('[data-sp="' + k + '"]');
  if (nb) nb.focus();
});
document.addEventListener("click", ev => {
  const t = ev.target.closest(".chip, .card");
  if (t && t.dataset.id) openEvent(Number(t.dataset.id));
});
/* os campos pertencem ao evento marcado em #ctl-wrap[data-ev], não ao evento aberto no momento */
const ctlEvent = ev => { const w = ev.target.closest("#ctl-wrap"); return w && w.dataset.ev ? Number(w.dataset.ev) : null; };
$("sh-body").addEventListener("input", ev => {
  const id = ctlEvent(ev);
  if (id === null) return;
  clearTimeout(ctlTimer[id]);
  ctlTimer[id] = setTimeout(() => saveCtl(id), 700);
});
$("sh-body").addEventListener("change", ev => { const id = ctlEvent(ev); if (id !== null) saveCtl(id); });
$("sh-body").addEventListener("focusout", ev => { const id = ctlEvent(ev); if (id !== null) saveCtl(id); });
$("close").addEventListener("click", closeEvent);
$("scrim").addEventListener("click", closeEvent);
["evprev", "evnext"].forEach(id => $(id).addEventListener("click", ev => {
  const to = ev.currentTarget.dataset.to;
  if (!to) return;
  const e = EVENTS.find(x => x.id === Number(to));
  const p = parse(e.date);
  if (p.y !== view.y || p.m !== view.m) { view = { y: p.y, m: p.m }; renderCal(); }
  openEvent(e.id, true);
}));
document.addEventListener("keydown", ev => {
  if ($("overlay").hidden) return;
  if (ev.key === "Escape") { closeEvent(); return; }
  if (ev.key !== "Tab") return;
  const f = [...$("sheet").querySelectorAll("button:not([disabled]), input:not([disabled]), textarea:not([disabled])")];
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1], at = document.activeElement;
  if (!$("sheet").contains(at)) { ev.preventDefault(); first.focus(); }
  else if (ev.shiftKey && at === first) { ev.preventDefault(); last.focus(); }
  else if (!ev.shiftKey && at === last) { ev.preventDefault(); first.focus(); }
});

renderCal();
initDb();
</script>
</body>
</html>
